<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Tokens per resumed session vs conversation length">
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#9b9a94}
.s1{fill:#2a78d6;stroke:#2a78d6}.s2{fill:#eb6834;stroke:#eb6834}.gap{stroke:#fcfcfb}
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}
.grid{stroke:#383835}.axis{stroke:#6b6a64}.s1{fill:#3987e5;stroke:#3987e5}.s2{fill:#d95926;stroke:#d95926}.gap{stroke:#1a1a19}}
</style>
<title>Tokens per resumed session vs conversation length</title>
<rect class="bg" width="720" height="380"/>
<text class="t1" x="24" y="30" font-size="16" font-weight="600">Tokens per resumed session vs conversation length</text>
<text class="t2" x="24" y="50" font-size="12">Mean total agent tokens over 3 scenarios (includes ~64K fixed agent overhead)</text>
<rect class="s1" x="70" y="65" width="10" height="10" rx="2"/>
<text class="t2" x="86" y="74" font-size="12">Without mnemonic</text>
<rect class="s2" x="220" y="65" width="10" height="10" rx="2"/>
<text class="t2" x="236" y="74" font-size="12">With mnemonic</text>
<line class="grid" x1="70" x2="570" y1="320.0" y2="320.0" stroke-width="1"/>
<text class="t2" x="62" y="324.0" font-size="11" text-anchor="end">0</text>
<line class="grid" x1="70" x2="570" y1="274.0" y2="274.0" stroke-width="1"/>
<text class="t2" x="62" y="278.0" font-size="11" text-anchor="end">20.0K</text>
<line class="grid" x1="70" x2="570" y1="228.0" y2="228.0" stroke-width="1"/>
<text class="t2" x="62" y="232.0" font-size="11" text-anchor="end">40.0K</text>
<line class="grid" x1="70" x2="570" y1="182.0" y2="182.0" stroke-width="1"/>
<text class="t2" x="62" y="186.0" font-size="11" text-anchor="end">60.0K</text>
<line class="grid" x1="70" x2="570" y1="136.0" y2="136.0" stroke-width="1"/>
<text class="t2" x="62" y="140.0" font-size="11" text-anchor="end">80.0K</text>
<line class="grid" x1="70" x2="570" y1="90.0" y2="90.0" stroke-width="1"/>
<text class="t2" x="62" y="94.0" font-size="11" text-anchor="end">100.0K</text>
<line class="axis" x1="70" x2="570" y1="320" y2="320" stroke-width="1"/>
<text class="t2" x="18" y="205.0" font-size="11" transform="rotate(-90 18 205.0)" text-anchor="middle">agent tokens</text>
<text class="t2" x="92.6" y="338" font-size="12" text-anchor="middle">~681</text>
<text class="t2" x="237.3" y="338" font-size="12" text-anchor="middle">~5.0K</text>
<text class="t2" x="570.0" y="338" font-size="12" text-anchor="middle">~15.0K</text>
<text class="t2" x="320.0" y="360" font-size="11" text-anchor="middle">previous conversation length (tokens)</text>
<polyline class="s1" fill="none" stroke-width="2" points="92.6,169.1 237.3,152.4 570.0,117.1"/>
<circle class="s1 gap" cx="92.6" cy="169.1" r="4.5" stroke-width="2" style="fill:currentColor"/>
<circle class="s1" cx="92.6" cy="169.1" r="4"/>
<circle class="s1 gap" cx="237.3" cy="152.4" r="4.5" stroke-width="2" style="fill:currentColor"/>
<circle class="s1" cx="237.3" cy="152.4" r="4"/>
<circle class="s1 gap" cx="570.0" cy="117.1" r="4.5" stroke-width="2" style="fill:currentColor"/>
<circle class="s1" cx="570.0" cy="117.1" r="4"/>
<text class="t1" x="580.0" y="121.1" font-size="12">Without 88.2K</text>
<polyline class="s2" fill="none" stroke-width="2" points="92.6,170.5 237.3,166.7 570.0,169.9"/>
<circle class="s2 gap" cx="92.6" cy="170.5" r="4.5" stroke-width="2" style="fill:currentColor"/>
<circle class="s2" cx="92.6" cy="170.5" r="4"/>
<circle class="s2 gap" cx="237.3" cy="166.7" r="4.5" stroke-width="2" style="fill:currentColor"/>
<circle class="s2" cx="237.3" cy="166.7" r="4"/>
<circle class="s2 gap" cx="570.0" cy="169.9" r="4.5" stroke-width="2" style="fill:currentColor"/>
<circle class="s2" cx="570.0" cy="169.9" r="4"/>
<text class="t1" x="580.0" y="173.9" font-size="12">With 65.2K</text>
</svg>